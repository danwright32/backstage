name: Secrets history

# NOT IN THE PUSH GATE, and that is the one thing that separates this from the
# working tree guard: it is the check whose cost grows with the number of
# commits, so it does not sit in front of every push from Dan's machine.
#
# WHAT IT RUNS ON IS EVERY ROUTE BY WHICH THE HISTORY CHANGES, which is what
# makes the schedule a backstop rather than the thing being relied on.
#
#   pull_request   a branch can hold a secret in one commit and remove it in the
#                  next, and the squash that lands on main keeps neither. The
#                  working tree guard sees the final state and passes it. This
#                  is the only place that intermediate commit is ever read.
#   push to main   what is actually published, asked the moment it is.
#   schedule       a backstop, and the one thing here that can stop without
#                  saying so: GitHub disables a scheduled workflow on a public
#                  repository after 60 days of repository inactivity (L13, L98).
#                  That is affordable ONLY because of the two triggers above: a
#                  history that nothing has pushed to has not changed, so the
#                  last run still covers it. If this ever becomes the only
#                  trigger, it needs something watching that it still runs.
#   dispatch       on demand, after a rule changes or a rotation.
#
# ONE RUN PER COMMIT still holds: push is narrowed to main, the one branch no
# pull request is opened from, so nothing here runs twice.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily. A secret in the history is compromised from the moment it was
    # pushed, so this is not a race a tighter interval would win: it is how long
    # a leak can sit UNNOTICED, and a day of that is the cost accepted here.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Secrets in the history
    runs-on: ubuntu-latest
    # A TIMEOUT ON EVERY JOB. GitHub's default is six hours, and a hung job
    # cannot be told from a slow one while it holds a runner slot.
    timeout-minutes: 15
    steps:
      # PINNED TO A SHA, never a moving tag.
      #
      # fetch-depth: 0 IS LOAD BEARING HERE. The default checkout is a single
      # commit, and this guard reads every blob reachable from every ref: given a
      # shallow clone it would examine one commit's worth and report clean, which
      # is precisely the shape of failure it exists to prevent.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Every blob ever committed, against the working tree guard's own rules
        run: bash scripts/check-secrets-history.sh .
